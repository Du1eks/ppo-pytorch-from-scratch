# LunarLander-v3 (discrete). Target: mean return >= 200.
# Batch 16 envs x 1024 steps = 16384, minibatches of 64. Tuned on seed 0 only: the earlier
# small-batch setup (8x128, clipped value loss, annealed lr) plateaued at ~50-90 return;
# larger batches, no value clipping and constant lr reached >200 on seed 0.
env_id: LunarLander-v3
total_timesteps: 1000000
num_envs: 16
num_steps: 1024
update_epochs: 4
num_minibatches: 256
lr: 0.0003
anneal_lr: false
gamma: 0.999
gae_lambda: 0.98
use_gae: true
clip_coef: 0.2
clip_vloss: false
norm_adv: true
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.0
normalize_obs: false
normalize_reward: false
hidden_sizes: [64, 64]
